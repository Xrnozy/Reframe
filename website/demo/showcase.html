<!doctype html>
<html lang="en" class="is-embedded">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reframe Showcase</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="site-header" class="site-header">
      <a href="#" class="brand-logo" aria-label="Reframe home">
        <span class="brand-icon" aria-hidden="true">◆</span>
        <span class="brand-text">Reframe</span>
      </a>
    </header>
    <main id="main-content">
      <section id="hero" class="hero">
        <div class="hero__inner">
          <p id="hero-eyebrow" class="hero__eyebrow">Visual development, grounded in source</p>
          <h1 id="rf-title" class="hero__title">Edit the interface you are <em>actually</em> running.</h1>
          <p class="hero__subtitle">Map edits to real files. Override what cannot be traced.</p>
          <div id="hero-actions" class="hero__actions">
            <button id="rf-cta" class="btn btn--primary btn--lg" type="button">Start building</button>
            <button id="rf-cta-2" class="btn btn--outline btn--lg" type="button">Watch demo</button>
          </div>
        </div>
      </section>
    </main>
    <script
      data-reframe-showcase="true"
      data-reframe-session="website-showcase"
      data-reframe-project-id="website-showcase"
      src="../assets/reframe-client.js"
      defer
    ></script>
  </body>
</html>
