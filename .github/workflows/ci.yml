name: Phase 6 verification

on:
  push:
  pull_request:

jobs:
  phase-6:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Phase 6 browsers on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Phase 6 browsers on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium firefox webkit
      - run: npm run test:phase6
      - run: npm run test:phase5:cross-browser
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            test-results
            playwright-report
            .reframe-test-artifacts
